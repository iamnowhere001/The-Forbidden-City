<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>紫禁城 · 故宫 3D 交互展示</title>
<link rel="stylesheet" href="css/style.css">
<!-- 尽早安装错误浮层，脚本加载阶段的异常也要抓到 -->
<script src="js/debug.js"></script>
<script src="js/config.js"></script>
</head>
<body>

<canvas id="scene"></canvas>
<div id="labels"></div>

<div id="loader">
  <div class="seal">紫禁</div>
  <div class="load-track"><div class="load-bar" id="load-bar"></div></div>
  <p id="load-text">相 地</p>
</div>

<header id="brand">
  <h1>紫禁城</h1>
  <div class="sub">The Forbidden City · 1420</div>
  <div class="rule"></div>
</header>

<aside id="sidebar">
  <div class="cap">宫殿索引</div>
  <div id="list"></div>
</aside>

<nav id="views">
  <!-- 按钮由 js/views.js 从 GG.CONFIG.views 生成 -->
</nav>

<div id="tools">
  <button class="tool" id="panel-toggle" title="收起索引">☰</button>
  <button class="tool" id="btn-labels" title="显示全部标注">标注</button>
  <button class="tool" id="btn-rotate" title="自动旋转">旋转</button>
  <div class="sep"></div>
  <div id="time" title="拖动改变日照时刻">
    <span class="tlabel">晨</span>
    <input type="range" id="sun" min="0" max="100" value="50" step="1" aria-label="日照时刻">
    <span class="tlabel">暮</span>
  </div>
  <div class="sep"></div>
  <button class="tool" id="btn-reset" title="回到全景">复位</button>
</div>

<div id="hint">
  <div><b>左键</b> 旋转 · <b>滚轮</b> 缩放 · <b>右键</b> 平移</div>
  <div>点击建筑或标注查看详情</div>
</div>

<section id="info">
  <button id="info-close">×</button>
  <span id="info-cat"></span>
  <h2 id="info-name"></h2>
  <div id="info-en"></div>
  <div id="info-year"></div>
  <dl id="info-meta" class="info-meta" hidden></dl>
  <p id="info-desc"></p>
  <details id="info-note" class="info-note" hidden>
    <summary>史料与考据</summary>
    <p id="info-note-text"></p>
  </details>
  <div class="info-actions">
    <button id="info-focus">聚 焦</button>
    <div class="info-nav">
      <button id="info-prev" title="上一座">‹</button>
      <button id="info-next" title="下一座">›</button>
    </div>
  </div>
</section>

<!-- 加载顺序有约束：后面的模块依赖前面挂在 window.GG 上的对象。
     three → 渲染基础设施 → 内容构件 → 主程序 -->
<script src="js/vendor/three.min.js"></script>
<script src="js/sky.js"></script>
<script src="js/orbit.js"></script>
<script src="js/renderer.js"></script>
<script src="js/views.js"></script>
<script src="js/labels.js"></script>
<script src="js/picking.js"></script>
<script src="js/ui.js"></script>
<script src="js/textures.js"></script>
<script src="js/geo.js"></script>
<script src="js/buildings.js"></script>
<script src="js/data/info.js"></script>
<script src="js/palace.js"></script>
<script src="js/app.js"></script>
</body>
</html>
